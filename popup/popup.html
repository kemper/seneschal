<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Seneschal</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Seneschal</h1>

  <label class="toggle">
    <input type="checkbox" id="palette" />
    <span class="text">
      <strong>Command palette</strong>
      <small>Cmd-K / Ctrl-K to jump anywhere</small>
    </span>
  </label>

  <label class="toggle">
    <input type="checkbox" id="dock" />
    <span class="text">
      <strong>Quick menu</strong>
      <small>The floating rail on the page edge</small>
    </span>
  </label>

  <label class="toggle">
    <input type="checkbox" id="heroes" />
    <span class="text">
      <strong>Hero panel</strong>
      <small>HP and heal buttons under the rail</small>
    </span>
  </label>

  <div class="row">
    <button type="button" id="side">Move to the left</button>
    <button type="button" id="options">Edit menu…</button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>

  <script src="../src/config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
